name: E2E Model Test

# Downloads the published philterd/ph-eye-pii-en-xsmall model from Hugging Face and runs the
# local-inference end-to-end tests against it. Kept off the per-PR build on purpose: the model is
# large and the download is network-dependent, so this runs only on demand and nightly.
on:
  workflow_dispatch:
  schedule:
    # Nightly at an offset minute (UTC). Scheduled runs are best-effort and may be delayed.
    - cron: "37 5 * * *"

jobs:
  e2e:
    name: Download model and run local-inference e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      PHILEAS_DOWNLOAD_MODEL: "1"
    steps:
      # phileas-dotnet references the PhiSQL .NET reference library via a ProjectReference
      # (../../../phisql/reference/dotnet/PhiSql/PhiSql.csproj), so phisql is checked out as a sibling.
      - name: Checkout phileas-dotnet
        uses: actions/checkout@v4
        with:
          path: phileas-dotnet

      - name: Checkout phisql
        uses: actions/checkout@v4
        with:
          repository: philterd/phisql
          path: phisql

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore phileas-dotnet/Phileas.slnx

      - name: Build
        run: dotnet build --no-restore phileas-dotnet/Phileas.slnx

      - name: Run the model-download end-to-end tests
        run: >-
          dotnet test --no-build --verbosity normal phileas-dotnet/Phileas.slnx
          --filter "FullyQualifiedName~XsmallEndToEndTests"
