name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore Phileas.sln

      - name: Build
        run: dotnet build --no-restore Phileas.sln

      - name: Test
        run: dotnet test --no-build --verbosity normal Phileas.sln
