name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # phileas-dotnet references the PhiSQL .NET reference library via a ProjectReference
      # (../../../phisql/reference/dotnet/PhiSql/PhiSql.csproj) because it is not yet on NuGet.
      # Both repositories are checked out as siblings so that relative path resolves.
      - name: Checkout phileas-dotnet
        uses: actions/checkout@v4
        with:
          path: phileas-dotnet

      - name: Checkout phisql
        uses: actions/checkout@v4
        with:
          repository: philterd/phisql
          path: phisql
          # If philterd/phisql is private, provide a PAT with read access as the PHISQL_TOKEN secret:
          # token: ${{ secrets.PHISQL_TOKEN }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore phileas-dotnet/Phileas.slnx

      - name: Build
        run: dotnet build --no-restore phileas-dotnet/Phileas.slnx

      - name: Test
        run: dotnet test --no-build --verbosity normal phileas-dotnet/Phileas.slnx
