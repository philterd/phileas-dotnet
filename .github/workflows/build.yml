name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      # Both SDKs are required: the projects multi-target net8.0 and net10.0, so the
      # net8.0 test run needs the .NET 8 runtime present alongside the .NET 10 SDK.
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore dependencies
        run: dotnet restore Phileas.slnx

      - name: Build
        run: dotnet build --no-restore Phileas.slnx

      - name: Test
        run: dotnet test --no-build --verbosity normal Phileas.slnx

      # Pack here (not just at publish time) so packaging regressions surface on every
      # change, and so the published package is the CI-built one: ContinuousIntegrationBuild
      # is set on GitHub Actions, which produces a deterministic build with normalized
      # SourceLink paths. Publishing is done manually by pushing this artifact.
      - name: Pack
        run: dotnet pack -c Release src/Phileas/Phileas.csproj -o ./artifacts

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            ./artifacts/*.nupkg
            ./artifacts/*.snupkg
          if-no-files-found: error
